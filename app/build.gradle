plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aurora.freecesswhitelist'
    compileSdk 33

    defaultConfig {
        applicationId "com.aurora.freecesswhitelist"
        minSdk 26            // 目标机是 Android 12，minSdk 只是下限
        // targetSdk 对齐设备（Android 12 = 31）：比设备高的 targetSdk 在部分 ROM 的
        // 安装器 / 旧版 LSPosed 上会多出无谓的兼容性提示，这里不需要
        targetSdk 31
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            // LSPosed 只要求 APK 被签名，直接复用 debug 签名，省掉 keystore 配置
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

// 源码里有大量中文注释，强制 UTF-8，避免 Windows 下用 GBK 编译出乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    // 只编译期使用：Xposed API 由 LSPosed 在运行时提供，
    // 绝不能 implementation 打进 APK，否则会和宿主里的类冲突。
    compileOnly 'de.robv.android.xposed:api:82'
}
